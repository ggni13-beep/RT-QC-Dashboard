<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RT Clinical Quality Dashboard</title>


  <!-- Chart.js -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


  <style>

    /* ==========================================
       基本設定
    ========================================== */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background: #f4f6f8;

      color: #1f2937;

      line-height: 1.6;

    }


    /* ==========================================
       Header
    ========================================== */

    header {

      background: white;

      border-bottom:
        1px solid #e5e7eb;

      padding:
        32px 20px;

    }


    .header-container {

      max-width: 1250px;

      margin: auto;

    }


    .header-title {

      display: flex;

      align-items: center;

      gap: 12px;

      flex-wrap: wrap;

    }


    header h1 {

      margin: 0;

      font-size: 30px;

      color: #1e293b;

    }


    .header-subtitle {

      margin-top: 8px;

      color: #64748b;

      font-size: 15px;

    }


    .update-tag {

      display: inline-block;

      margin-top: 12px;

      padding:
        6px 12px;

      border-radius: 20px;

      background: #eef2f7;

      color: #475569;

      font-size: 13px;

    }


    /* ==========================================
       Main
    ========================================== */

    main {

      max-width: 1250px;

      margin: auto;

      padding:
        30px 18px 70px;

    }


    /* ==========================================
       Section
    ========================================== */

    .section {

      margin-top: 36px;

    }


    .section-header {

      margin-bottom: 16px;

    }


    .section-header h2 {

      margin: 0 0 5px 0;

      font-size: 23px;

      color: #1e293b;

    }


    .section-header p {

      margin: 0;

      font-size: 14px;

      color: #64748b;

    }


    /* ==========================================
       Card
    ========================================== */

    .card {

      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 16px;

      padding: 22px;

      box-shadow:
        0 2px 8px rgba(15,23,42,0.03);

    }


    /* ==========================================
       KPI
    ========================================== */

    .kpi-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 16px;

    }


    .kpi-card {

      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 16px;

      padding: 20px;

      min-height: 150px;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

    }


    .kpi-label {

      color: #64748b;

      font-size: 14px;

    }


    .kpi-value {

      font-size: 34px;

      font-weight: 700;

      color: #1e293b;

      margin:
        8px 0;

    }


    .kpi-footer {

      font-size: 13px;

      color: #64748b;

    }


    .target-good {
      color: #047857;
    }


    .target-watch {
      color: #b45309;
    }


    /* ==========================================
       Summary
    ========================================== */

    .summary-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;

    }


    .summary-item {

      padding: 18px;

      border-radius: 14px;

      background: #f8fafc;

      border:
        1px solid #e5e7eb;

    }


    .summary-label {

      color: #64748b;

      font-size: 13px;

    }


    .summary-value {

      font-size: 27px;

      font-weight: 700;

      margin-top: 6px;

    }


    /* ==========================================
       Chart
    ========================================== */

    .chart-box {

      position: relative;

      height: 420px;

    }


    /* ==========================================
       Findings
    ========================================== */

    .finding-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;

    }


    .finding-card {

      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 16px;

      padding: 20px;

    }
